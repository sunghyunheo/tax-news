# 발행 URL: https://sunghyunheo.github.io/tax-news/
# 메일 수신: sh.heo@sk.com (아래 "메일 발송" 스텝, 자격증명은 저장소 Secrets)
name: daily-tax-news

on:
  schedule:
    # 매일 13:00 KST (= 04:00 UTC). KST 는 UTC+9 이므로 항상 9시간을 뺀다.
    # GitHub 의 예약 실행은 부하에 따라 보통 5~15분 늦게 시작한다.
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집
        run: python collect.py

      - name: 페이지 렌더링
        run: python render.py

      # ---- 메일은 Pages 배포보다 먼저 보낸다. Pages 설정이 안 돼 있어도 메일은 나가야 한다.
      - name: 메일 본문 생성
        id: digest
        run: |
          python email_digest.py
          echo "subject=$(cat mail/subject.txt)" >> "$GITHUB_OUTPUT"

      # secrets 컨텍스트는 if: 에서 쓸 수 없어 env 로 옮겨 판정한다.
      - name: 메일 자격증명 확인
        id: cred
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::MAIL_USERNAME / MAIL_PASSWORD Secret 이 없어 메일 발송을 건너뜁니다."
          fi

      - name: 메일 발송
        if: steps.cred.outputs.ready == 'yes'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 세무 뉴스 브리핑 <${{ secrets.MAIL_USERNAME }}>
          to: sh.heo@sk.com
          subject: ${{ steps.digest.outputs.subject }}
          html_body: file://mail/digest.html
          convert_markdown: false

      - name: 아카이브 커밋
        run: |
          git config user.name  "tax-news-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "chore: $(TZ=Asia/Seoul date +%F) 뉴스 갱신"
          git push

      # ---- Pages 배포. 저장소 Settings > Pages 의 Source 가 GitHub Actions 여야 동작한다.
      # 아직 안 켜져 있으면 이 스텝만 실패로 두고(continue-on-error) 나머지는 이미 끝나 있다.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs

      - name: Pages 미설정 안내
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages 가 아직 켜져 있지 않아 사이트 배포를 건너뜁니다."
          echo "Settings > Pages > Source 를 'GitHub Actions' 로 바꾸면 다음 실행부터 배포됩니다."

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
