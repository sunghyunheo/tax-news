# 발행 URL: https://skn-tax.github.io/tax-news/
name: daily-tax-news

on:
  schedule:
    # 매일 07:10 KST (= 22:10 UTC 전날). 원하면 여러 줄로 늘려도 된다.
    - cron: "10 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집
        run: python collect.py

      - name: 페이지 렌더링
        run: python render.py

      - name: 아카이브 커밋
        run: |
          git config user.name  "tax-news-bot"
          git config user.email "actions@github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "chore: $(TZ=Asia/Seoul date +%F) 뉴스 갱신"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
